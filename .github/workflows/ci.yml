# =============================================================================
# CI — openai-agent-skill (frederico-kluser/openai-agent-skill)
#
# Stack: Python (CLI stdlib + exemplos) e Node (exemplos ESM). Zero dependências.
# NOTA: as actions estão fixadas por SHA por `oss-pin-actions.sh` (formato
#     owner/repo@<SHA> # vX.Y.Z
# =============================================================================
name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

# Privilégio mínimo: o CI só precisa de ler o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Python syntax (CLI + exemplos)
        run: |
          python -m py_compile scripts/openai.py
          for f in examples/python/*.py; do python -m py_compile "$f"; done

      - name: Node syntax (exemplos)
        run: |
          for f in examples/node/*.mjs; do node --check "$f"; done

  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Selftest offline (11 cenários, sem rede)
        run: python scripts/openai.py selftest

      - name: Recusa sem key (contrato exit 2)
        run: |
          unset OPENAI_API_KEY OPENAI_API_KEY_1 OPENAI_API_KEY_2 OPENAI_API_KEY_3
          if python scripts/openai.py models; then
            echo "ERRO: o CLI trabalhou sem key no ambiente"; exit 1
          else
            echo "OK: recusa sem key confirmada"
          fi

  # Job AGREGADOR — o seu NOME (`build`) é o `context` exigido pelo ruleset
  # (assets/rulesets/regras-main.json). Não renomeie sem atualizar o ruleset.
  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Commits convencionais (últimos 25)
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          header = re.compile(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?!?: .+')
          skip = re.compile(r'^(Merge |Revert "|Reapply "|fixup!|squash!)')
          out = subprocess.run(['git', 'log', '--pretty=tformat:%s', '-n', '25', 'HEAD'],
                               capture_output=True, text=True).stdout
          bad = 0
          for s in out.splitlines():
              s = s.strip()
              if not s or skip.match(s):
                  continue
              h = re.sub(r'\s+\(#\d+\)$', '', s)   # sufixo "(#N)" do squash não conta
              if not header.match(h) or len(h) > 72:
                  print('ERRO: mensagem fora de Conventional Commits:', s); bad = 1
              else:
                  print('OK  :', s)
          sys.exit(bad)
          PY

      - name: Sem segredos no diff do push
        run: |
          echo "varrimento: o hook pre-push local + oss-gate.sh push --scan-only cobrem o histórico"
